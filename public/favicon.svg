<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a7cff"/>
      <stop offset="50%" style="stop-color:#2563eb"/>
      <stop offset="100%" style="stop-color:#1d4ed8"/>
    </linearGradient>
    <linearGradient id="ribbon1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#e8f0fe"/>
    </linearGradient>
    <linearGradient id="ribbon2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff"/>
      <stop offset="100%" style="stop-color:#d4e4ff"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0d2f6b" flood-opacity="0.4"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="108" fill="url(#bg)"/>
  
  <!-- S Ribbon Shape - Main Body -->
  <g filter="url(#shadow)" transform="translate(256,256)">
    <!-- Top horizontal bar -->
    <path d="M-80,-140 L80,-140 Q120,-140 120,-100 L120,-80 Q120,-60 100,-60 L-60,-60 Q-100,-60 -100,-20 L-100,0 Q-100,20 -80,20" 
          fill="none" stroke="url(#ribbon1)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom horizontal bar -->
    <path d="M80,140 L-80,140 Q-120,140 -120,100 L-120,80 Q-120,60 -100,60 L60,60 Q100,60 100,20 L100,0 Q100,-20 80,-20" 
          fill="none" stroke="url(#ribbon2)" stroke-width="48" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Diagonal connecting piece -->
    <path d="M-80,20 L80,-20" 
          fill="none" stroke="url(#ribbon1)" stroke-width="48" stroke-linecap="round"/>
  </g>
</svg>
